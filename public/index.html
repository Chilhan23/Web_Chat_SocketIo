<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div id="name-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: white; padding: 30px; border-radius: 15px; text-align: center; width: 90%; max-width: 400px;">
        <h2 style="margin-bottom: 20px; color: #1976d2;">Selamat Datang!</h2>
        <p style="margin-bottom: 15px;">Masukkan nama kamu untuk mulai chat:</p>
        <input type="text" id="modal-name-input" placeholder="Nama kamu..." style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 25px; outline: none;">
        <button id="join-btn" style="background: #2196f3; color: white; border: none; padding: 10px 25px; border-radius: 25px; cursor: pointer; font-weight: 600;">Gabung Chat</button>
    </div>
</div>
    <h1 class="title">Aplikasi Chat</h1>
    <div class="main">
        <div class="name">
            <span><i class="far fa-user"></i></span>
            <input type="text" id="name-input" class="name-input" value="" placeholder="Isii Namaa Disinii" maxlength="20">

        </div>
        <ul class="message-container" id="message-container">
        </ul>
        <form class="message-form" id="message-form">
            <input type="text" class="message-input" id="message-input">
            <div class="v-divider"></div>
            <button type="submit" class="send-button">
                send <span><i class="fa fa-paper-plane"></i></span>
            </button>
        </form>
    </div>
     <h3 class="client-total" id="client-total">
        total CLient : 2
    </h3>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js" integrity="sha512-hUhvpC5f8cgc04OZb55j0KNGh4eh7dLxd/dPSJ5VyzqDWxsayYbojWyl5Tkcgrmb/RVKCRJI1jNlRbVP4WWC4w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="main.js"></script>
</body>
</html>
